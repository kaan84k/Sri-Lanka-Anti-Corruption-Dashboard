<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sri Lanka Anti-Corruption Case Tracker</title>
    <meta
      name="description"
      content="Court hearings from CIABOC cause lists — Sri Lanka's Commission to Investigate Allegations of Bribery or Corruption. Parsed, searchable, and tracked."
    />
    <meta name="theme-color" content="#470b1f" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23470b1f'/%3E%3Cg fill='none' stroke='%23c89b2c' stroke-width='1.6' stroke-linecap='round'%3E%3Cpath d='M16 6v20M9 26h14'/%3E%3Cpath d='M6 11h20'/%3E%3Cpath d='M6 11l-2.5 5h5zM26 11l-2.5 5h5z'/%3E%3C/g%3E%3Ccircle cx='16' cy='6' r='1.6' fill='%23c89b2c'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      // Set theme before first paint to avoid a flash. App keeps it in sync.
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t !== 'light' && t !== 'dark') {
            t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
